# Include inside the canonical churchcentral.church server block.
# Keep the server's existing document root, TLS, API proxy and asset settings.
error_page 404 /404.html;

location = / {
    try_files /index.html =404;
}

location = /index.html {
    return 308 /$is_args$args;
}

location = /404.html {
    internal;
}

location = /app.html {
    internal;
}

location = /private-app.html {
    internal;
}

location ~ ^/(?<marketing_path>(?:features|pricing|about|contact|referrals|terms|privacy)(?:/[^/.]+)?)(?:/|\.html)$ {
    return 308 /$marketing_path$is_args$args;
}

location ~* ^/(dashboard|admin|login|register|verify-email|forgot-password|reset-password|payment|invoice|attendance|check-in)(/|$) {
    try_files /private-app.html =404;
}

location ~ ^/(events|giving)/[^/]+/?$ {
    try_files /app.html =404;
}

location / {
    try_files $uri.html $uri =404;
}
